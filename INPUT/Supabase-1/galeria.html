<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos</title>

  <!-- CDN de Supabase: va ANTES de nuestros scripts, para que
       supabase.createClient exista cuando supabaseClient.js lo use -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- TIPOGRAFÍA: las mismas de admin.html y cliente.html
       Inter Tight → títulos y texto · IBM Plex Mono → etiquetas y precios -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Aplica el tema guardado ANTES de pintar, para que no parpadee en
       blanco al recargar. Misma clave 'tema' que las otras páginas. -->
  <script>
    const temaGuardado = localStorage.getItem('tema');
    const prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (temaGuardado === 'oscuro' || (temaGuardado === null && prefiereOscuro)) {
      document.documentElement.dataset.tema = 'oscuro';
    }
  </script>

  <style>
    /* ============================================================
       VARIABLES: copiadas de admin/cliente para el mismo look.
       Blanco y negro, líneas finas, pastillas, mucho aire.
       ============================================================ */
    :root {
      --sans: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;

      --fondo: #ffffff;
      --texto: #0a0a0a;
      --suave: #636363;
      --linea: #0a0a0a;
      --linea-suave: #e3e3e3;

      --boton-fondo: #0a0a0a;
      --boton-texto: #ffffff;
      --boton-borde: #0a0a0a;
      --boton-hover-fondo: #ffffff;
      --boton-hover-texto: #0a0a0a;

      --input-fondo: #ffffff;
      --input-texto: #0a0a0a;
      --input-borde: #a3a3a3;

      --tarjeta-foto: #f4f4f4; /* fondo gris claro detrás de la foto */
    }

    :root[data-tema="oscuro"] {
      color-scheme: dark;
      --fondo: #0b0b0b;
      --texto: #f2f2f2;
      --suave: #a6a6a6;
      --linea: #f2f2f2;
      --linea-suave: #2b2b2b;

      --boton-fondo: #ffffff;
      --boton-texto: #0a0a0a;
      --boton-borde: #ffffff;
      --boton-hover-fondo: #d4d4d4;
      --boton-hover-texto: #0a0a0a;

      --input-fondo: #ffffff;
      --input-texto: #0a0a0a;
      --input-borde: #ffffff;

      --tarjeta-foto: #161616;
    }

    /* ============================ BASE ============================ */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0 clamp(16px, 4vw, 56px) 80px;
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: -0.01em;
      background: var(--fondo);
      color: var(--texto);
      transition: background 0.25s, color 0.25s;
    }

    a { color: inherit; }

    :focus-visible {
      outline: 2px solid var(--texto);
      outline-offset: 2px;
    }

    /* etiqueta pequeña en mayúsculas y monoespaciada */
    .rotulo {
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ======================= BARRA SUPERIOR ======================= */
    .barra-superior {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 18px 0;
      background: var(--fondo);
      border-bottom: 1px solid var(--linea);
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.05em;
      text-decoration: none;
      line-height: 1;
      transition: letter-spacing 0.3s;
    }

    .logo:hover { letter-spacing: -0.02em; }

    /* enlaces de navegación de la barra */
    .nav {
      display: flex;
      gap: 20px;
      margin-left: 8px;
    }

    .nav a {
      font-family: var(--mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-decoration: none;
      color: var(--suave);
      padding-bottom: 2px;
      transition: color 0.2s;
    }

    .nav a:hover,
    .nav a.activo { color: var(--texto); }

    .nav a.activo {
      background: linear-gradient(currentColor, currentColor) left bottom / 100% 1px no-repeat;
    }

    .barra-acciones {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    /* botón pastilla (tema) */
    #btn-tema {
      padding: 10px 18px;
      border: 1px solid var(--boton-borde);
      border-radius: 999px;
      background: var(--boton-fondo);
      color: var(--boton-texto);
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }

    #btn-tema:hover {
      background: var(--boton-hover-fondo);
      color: var(--boton-hover-texto);
      transform: translateY(-2px);
    }

    #btn-tema::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 8px;
      border: 1px solid currentColor;
      border-radius: 50%;
      background: linear-gradient(90deg, currentColor 50%, transparent 50%);
      vertical-align: -1px;
      transition: transform 0.4s;
    }

    #btn-tema:hover::before { transform: rotate(180deg); }

    /* icono de cuenta → cliente.html */
    .cuenta {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--linea);
      border-radius: 50%;
      color: var(--texto);
      transition: background 0.2s, color 0.2s;
    }

    .cuenta:hover {
      background: var(--texto);
      color: var(--fondo);
    }

    /* botón redondo de icono (carrito): mismo look que la cuenta */
    .icono-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid var(--linea);
      border-radius: 50%;
      background: transparent;
      color: var(--texto);
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }

    .icono-btn:hover {
      background: var(--texto);
      color: var(--fondo);
      transform: translateY(-2px);
    }

    /* globito con el número de productos en el carrito */
    .carrito-cuenta {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #b91c1c;
      color: #ffffff;
      font-family: var(--mono);
      font-size: 0.62rem;
      font-weight: 500;
      line-height: 1;
    }

    .carrito-cuenta[hidden] { display: none; }

    /* =========================== HERO ============================ */
    .hero {
      padding: clamp(32px, 6vw, 64px) 0 28px;
    }

    .hero .rotulo { color: var(--suave); }

    .hero h1 {
      margin: 10px 0 0;
      font-size: clamp(2.2rem, 7vw, 4.2rem);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .hero p {
      margin: 14px 0 0;
      max-width: 48ch;
      color: var(--suave);
    }

    /* ====================== BARRA DE FILTROS ====================== */
    /* sticky bajo la barra superior, como el "Filtrar y ordenar" de adidas */
    .herramientas {
      position: sticky;
      top: 73px; /* justo debajo de la barra superior */
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 20px;
      padding: 16px 0;
      background: var(--fondo);
      border-top: 1px solid var(--linea);
      border-bottom: 1px solid var(--linea-suave);
    }

    /* PILLS DE CATEGORÍA (scroll horizontal si no caben) */
    .categorias {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }

    .pill {
      flex-shrink: 0;
      padding: 8px 16px;
      border: 1px solid var(--input-borde);
      border-radius: 999px;
      background: transparent;
      color: var(--texto);
      font-family: var(--mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .pill:hover { border-color: var(--texto); }

    /* pastilla activa: negra rellena (se invierte en oscuro) */
    .pill.activo {
      background: var(--boton-fondo);
      color: var(--boton-texto);
      border-color: var(--boton-borde);
    }

    /* buscador compacto */
    .buscador {
      position: relative;
      display: flex;
      align-items: center;
    }

    .buscador svg {
      position: absolute;
      left: 12px;
      color: var(--suave);
      pointer-events: none;
    }

    #busqueda {
      width: 180px;
      padding: 9px 14px 9px 36px;
      border: 1px solid var(--input-borde);
      border-radius: 999px;
      background: var(--input-fondo);
      color: var(--input-texto);
      font: inherit;
      font-size: 0.85rem;
      transition: border-color 0.2s, width 0.25s;
    }

    #busqueda:focus { outline: 2px solid var(--texto); outline-offset: -1px; }

    /* "Solo disponibles": interruptor */
    .switch {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--suave);
      cursor: pointer;
      white-space: nowrap;
    }

    .switch input { position: absolute; opacity: 0; pointer-events: none; }

    .switch .riel {
      position: relative;
      width: 38px;
      height: 22px;
      border-radius: 999px;
      background: #c7c7c7;
      transition: background 0.2s;
    }

    .switch .riel::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      transition: transform 0.2s;
    }

    .switch input:checked + .riel { background: var(--texto); }
    .switch input:checked + .riel::after { transform: translateX(16px); }
    .switch input:focus-visible + .riel { outline: 2px solid var(--texto); outline-offset: 2px; }

    /* ORDENAR POR: lista desplegable con estilo (versión ligera) */
    #orden { position: relative; }

    #orden-boton {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border: 1px solid var(--input-borde);
      border-radius: 999px;
      background: var(--input-fondo);
      color: var(--input-texto);
      font-family: var(--mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    #orden-boton:hover { border-color: var(--texto); }

    #orden-boton::after {
      content: '';
      width: 6px; height: 6px;
      margin-left: 2px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      transition: transform 0.25s;
    }

    #orden-boton[aria-expanded="true"]::after { transform: rotate(225deg); }

    #orden-lista {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 25;
      min-width: 220px;
      margin: 0;
      padding: 6px;
      list-style: none;
      background: #ffffff;
      color: #0a0a0a;
      border: 1px solid #d4d4d4;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14);
      animation: desplegar 0.2s ease;
    }

    @keyframes desplegar {
      from { opacity: 0; transform: translateY(-6px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    #orden-lista button {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #0a0a0a;
      font-family: var(--sans);
      font-size: 0.9rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, padding-left 0.15s;
    }

    #orden-lista button:hover { background: #f0f0f0; padding-left: 16px; }
    #orden-lista button[aria-selected="true"] { font-weight: 600; }
    #orden-lista button[aria-selected="true"]::after { content: '✓'; margin-left: auto; }

    /* ========================= CONTADOR ========================== */
    .conteo {
      padding: 20px 0 4px;
      font-family: var(--mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--suave);
    }

    /* ====================== GRID DE PRODUCTOS ===================== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 28px 20px;
      padding-top: 16px;
    }

    .producto {
      cursor: pointer;
      outline-offset: 4px;
    }

    /* la foto va sobre un cuadro gris claro, cuadrada */
    .producto-media {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--tarjeta-foto);
      border-radius: 14px;
    }

    .producto-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    /* al pasar el mouse por la tarjeta, la foto hace un zoom suave */
    .producto:hover .producto-media img { transform: scale(1.06); }

    /* producto agotado: la foto se ve apagada */
    .producto-media.agotado img { opacity: 0.45; filter: grayscale(0.4); }

    /* la "foto que falta" (si la URL no carga) ocupa todo el cuadro */
    .producto-media .sin-foto {
      display: block;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(to top right, transparent calc(50% - 0.5px), #c7c7c7 50%, transparent calc(50% + 0.5px)),
        var(--tarjeta-foto);
    }

    /* BANDERITAS (badges) arriba a la izquierda */
    .badges {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 0.62rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .badge-dto { background: #0a0a0a; color: #ffffff; }
    .badge-pocas { background: #ffffff; color: #0a0a0a; border: 1px solid #0a0a0a; }

    /* "Agotado": franja centrada sobre la foto */
    .etiqueta-agotado {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 6px 16px;
      background: var(--fondo);
      color: var(--texto);
      border: 1px solid var(--linea);
      font-family: var(--mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* CORAZÓN de favorito, arriba a la derecha (aparece al hacer hover) */
    .fav {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      color: #0a0a0a;
      cursor: pointer;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.2s, transform 0.2s, background 0.2s;
    }

    .fav svg { fill: none; stroke: currentColor; stroke-width: 1.6; }

    /* el corazón se ve siempre si está marcado, o al pasar el mouse */
    .producto:hover .fav,
    .producto:focus-within .fav,
    .fav.activo {
      opacity: 1;
      transform: scale(1);
    }

    .fav:hover { background: #ffffff; }
    .fav.activo { color: #b91c1c; }
    .fav.activo svg { fill: #b91c1c; stroke: #b91c1c; }

    /* INFO debajo de la foto */
    .producto-info { padding: 12px 2px 0; }

    .producto-nombre {
      margin: 4px 0 0;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .producto-cats {
      margin: 2px 0 0;
      font-family: var(--mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--suave);
    }

    /* PRECIO (mismas clases que admin) */
    .precio {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 2px 8px;
      white-space: nowrap;
    }

    .precio-ahora {
      font-family: var(--mono);
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--texto);
    }

    .precio-antes {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--suave);
      text-decoration: line-through;
      text-decoration-color: #b91c1c;
    }

    /* ===================== SIN RESULTADOS ======================== */
    #sin-resultados {
      padding: 80px 0;
      text-align: center;
      color: var(--suave);
    }

    #sin-resultados[hidden] { display: none; }

    /* ===================== CARGAR MÁS ============================ */
    .pie-grid {
      display: flex;
      justify-content: center;
      padding-top: 48px;
    }

    #cargar-mas {
      padding: 14px 32px;
      border: 1px solid var(--boton-borde);
      border-radius: 999px;
      background: var(--boton-fondo);
      color: var(--boton-texto);
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }

    #cargar-mas:hover {
      background: var(--boton-hover-fondo);
      color: var(--boton-hover-texto);
      transform: translateY(-2px);
    }

    #cargar-mas[hidden] { display: none; }

    /* ========================= FICHA (dialog) ==================== */
    #ficha {
      width: min(880px, calc(100% - 32px));
      padding: 0;
      border: none;
      background: transparent;
      overflow: visible;
    }

    #ficha::backdrop {
      background: rgba(10, 10, 10, 0.55);
      backdrop-filter: blur(4px);
    }

    .ficha-caja {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--linea);
      border-radius: 20px;
      overflow: hidden;
      background: var(--fondo);
      color: var(--texto);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.3);
      animation: emerger 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }

    @keyframes emerger {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .ficha-foto {
      position: relative;
      background: var(--tarjeta-foto);
      min-height: 360px;
    }

    .ficha-foto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ficha-foto.agotado img { opacity: 0.5; filter: grayscale(0.4); }

    .ficha-foto .sin-foto {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 360px;
      background:
        linear-gradient(to top right, transparent calc(50% - 0.5px), #c7c7c7 50%, transparent calc(50% + 0.5px)),
        var(--tarjeta-foto);
    }

    .ficha-cuerpo {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 36px 32px;
    }

    .ficha-cuerpo .rotulo { color: var(--suave); }

    .ficha-cuerpo h2 {
      margin: 0;
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .ficha-desc { margin: 0; color: var(--suave); }

    .ficha-cuerpo .precio-ahora { font-size: 1.4rem; }
    .ficha-cuerpo .precio-antes { font-size: 0.9rem; }

    .ficha-cats { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }

    .etiqueta {
      display: inline-block;
      padding: 3px 10px;
      border: 1px solid var(--input-borde);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .btn-agregar {
      margin-top: 8px;
      padding: 14px 24px;
      border: 1px solid var(--boton-borde);
      border-radius: 999px;
      background: var(--boton-fondo);
      color: var(--boton-texto);
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }

    .btn-agregar:not([disabled]):hover {
      background: var(--boton-hover-fondo);
      color: var(--boton-hover-texto);
      transform: translateY(-2px);
    }

    .btn-agregar[disabled] { opacity: 0.4; cursor: not-allowed; }

    .ficha-cerrar {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 38px;
      height: 38px;
      border: 1px solid var(--linea);
      border-radius: 50%;
      background: var(--fondo);
      color: var(--texto);
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.25s, background 0.2s, color 0.2s;
    }

    .ficha-cerrar:hover {
      transform: rotate(90deg);
      background: var(--texto);
      color: var(--fondo);
    }

    /* la ficha pasa a una sola columna en pantallas angostas */
    @media (max-width: 680px) {
      .ficha-caja { grid-template-columns: 1fr; }
      .ficha-foto, .ficha-foto .sin-foto { min-height: 280px; }
    }

    /* ====================== CARRITO (panel lateral) ============== */
    /* el <dialog> se pega al borde derecho y ocupa todo el alto */
    #carrito {
      margin: 0 0 0 auto;
      height: 100vh;
      max-height: 100vh;
      width: min(420px, 100%);
      padding: 0;
      border: none;
      background: transparent;
    }

    #carrito::backdrop {
      background: rgba(10, 10, 10, 0.55);
      backdrop-filter: blur(4px);
    }

    .drawer-caja {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--fondo);
      color: var(--texto);
      border-left: 1px solid var(--linea);
      animation: deslizar 0.3s ease;
    }

    @keyframes deslizar {
      from { transform: translateX(100%); }
      to   { transform: translateX(0); }
    }

    .drawer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 24px;
      border-bottom: 1px solid var(--linea);
    }

    .drawer-top h2 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .drawer-top h2 span {
      color: var(--suave);
      font-family: var(--mono);
      font-size: 0.9rem;
    }

    .drawer-cerrar {
      width: 36px;
      height: 36px;
      border: 1px solid var(--linea);
      border-radius: 50%;
      background: var(--fondo);
      color: var(--texto);
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.25s, background 0.2s, color 0.2s;
    }

    .drawer-cerrar:hover {
      transform: rotate(90deg);
      background: var(--texto);
      color: var(--fondo);
    }

    /* lista de productos del carrito: se desplaza si hay muchos */
    .carrito-items {
      flex: 1;
      overflow-y: auto;
      padding: 8px 24px;
    }

    /* mensaje cuando el carrito está vacío */
    .carrito-vacio {
      padding: 60px 0;
      text-align: center;
      color: var(--suave);
    }

    .carrito-item {
      display: flex;
      gap: 14px;
      padding: 18px 0;
      border-bottom: 1px solid var(--linea-suave);
    }

    .carrito-item img,
    .carrito-item .sin-foto {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 10px;
      background: var(--tarjeta-foto);
    }

    .ci-info { flex: 1; min-width: 0; }

    .ci-info strong {
      display: block;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .ci-precio-unit {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--suave);
    }

    /* control de cantidad: - [n] + */
    .ci-cantidad {
      display: inline-flex;
      align-items: center;
      gap: 0;
      margin-top: 10px;
      border: 1px solid var(--input-borde);
      border-radius: 999px;
      overflow: hidden;
    }

    .ci-cantidad button {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--texto);
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s;
    }

    .ci-cantidad button:hover { background: var(--linea-suave); }

    .ci-cantidad span {
      min-width: 28px;
      text-align: center;
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    .ci-der {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
    }

    .ci-quitar {
      border: none;
      background: transparent;
      color: var(--suave);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
      transition: color 0.2s;
    }

    .ci-quitar:hover { color: #b91c1c; }

    .ci-total {
      font-family: var(--mono);
      font-size: 0.9rem;
      font-weight: 500;
    }

    /* pie del carrito: total + botones */
    .drawer-pie {
      padding: 20px 24px;
      border-top: 1px solid var(--linea);
    }

    .carrito-total-fila {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .carrito-total-fila span:first-child {
      font-family: var(--mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--suave);
    }

    .carrito-total-fila span:last-child {
      font-family: var(--mono);
      font-size: 1.4rem;
      font-weight: 500;
    }

    .drawer-botones {
      display: flex;
      gap: 10px;
    }

    .btn-secundario {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid var(--input-borde);
      border-radius: 999px;
      background: transparent;
      color: var(--texto);
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .btn-secundario:hover { border-color: var(--texto); background: var(--linea-suave); }

    .drawer-pie .btn-agregar {
      flex: 2;
      margin-top: 0;
    }

    .drawer-pie .btn-agregar[disabled] { opacity: 0.4; cursor: not-allowed; }

    /* ======================= AVISO FLOTANTE ====================== */
    #aviso {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 999px;
      background: var(--boton-fondo);
      color: var(--boton-texto);
      font-family: var(--mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
      animation: aparecer 0.3s ease;
    }

    #aviso[hidden] { display: none; }
    #aviso::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }

    @keyframes aparecer {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header class="barra-superior">
    <a href="galeria.html" class="logo">Productos</a>
    <nav class="nav">
      <a href="galeria.html" class="activo">Tienda</a>
      <a href="admin.html">Inventario</a>
    </nav>

    <div class="barra-acciones">
      <button type="button" id="btn-tema">Modo oscuro</button>

      <!-- CARRITO: el número lo pone galeria.js (cuántos productos hay dentro) -->
      <button type="button" id="btn-carrito" class="icono-btn" aria-label="Abrir carrito">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="20" r="1.4"/>
          <circle cx="18" cy="20" r="1.4"/>
          <path d="M2 3h2.2l2.3 12.1a1.5 1.5 0 0 0 1.5 1.2h8.8a1.5 1.5 0 0 0 1.5-1.2L21 7H5.3"/>
        </svg>
        <span id="carrito-cuenta" class="carrito-cuenta" hidden>0</span>
      </button>

      <!-- cuenta → la página del cliente (login / perfil) -->
      <a href="cliente.html" class="cuenta" aria-label="Mi cuenta">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- HERO: encabezado del catálogo -->
  <section class="hero">
    <p class="rotulo">Catálogo</p>
    <h1>Todos los productos</h1>
    <p>Explora todo lo que tenemos disponible. Usa los filtros para encontrar lo que buscas y toca cualquier producto para ver su ficha.</p>
  </section>

  <!-- BARRA DE FILTROS Y ORDEN (sticky, como el "Filtrar y ordenar" de adidas) -->
  <div class="herramientas">
    <!-- pills de categoría (las pinta galeria.js a partir de los productos) -->
    <div class="categorias" id="categorias" role="group" aria-label="Filtrar por categoría"></div>

    <div class="buscador">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="M21 21l-4-4"/>
      </svg>
      <input type="search" id="busqueda" placeholder="Buscar" aria-label="Buscar por nombre">
    </div>

    <label class="switch">
      <input type="checkbox" id="solo-disponibles">
      <span class="riel"></span>
      Solo disponibles
    </label>

    <!-- ORDENAR POR -->
    <div id="orden">
      <button type="button" id="orden-boton" aria-haspopup="listbox" aria-expanded="false">
        Ordenar: <span id="orden-valor">Destacados</span>
      </button>
      <ul id="orden-lista" role="listbox" hidden>
        <li><button type="button" data-orden="destacados" aria-selected="true">Destacados</button></li>
        <li><button type="button" data-orden="precio-asc" aria-selected="false">Precio: menor a mayor</button></li>
        <li><button type="button" data-orden="precio-desc" aria-selected="false">Precio: mayor a menor</button></li>
        <li><button type="button" data-orden="nombre" aria-selected="false">Nombre (A–Z)</button></li>
        <li><button type="button" data-orden="descuento" aria-selected="false">Mayor descuento</button></li>
      </ul>
    </div>
  </div>

  <!-- contador de resultados -->
  <p class="conteo" id="contador"></p>

  <!-- GRID: galeria.js lo llena con las tarjetas -->
  <main class="grid" id="grid"></main>

  <!-- mensaje cuando el filtro no deja nada -->
  <p id="sin-resultados" hidden>No hay productos que coincidan. Prueba quitar algún filtro.</p>

  <!-- CARGAR MÁS -->
  <div class="pie-grid">
    <button type="button" id="cargar-mas" hidden>Cargar más</button>
  </div>

  <!-- FICHA DEL PRODUCTO: un <dialog>, igual que la tarjeta de admin -->
  <dialog id="ficha" aria-label="Ficha del producto">
    <article class="ficha-caja">
      <button type="button" class="ficha-cerrar" aria-label="Cerrar">×</button>
      <!-- galeria.js llena #ficha-contenido con la foto y los datos -->
      <div id="ficha-contenido" style="display:contents"></div>
    </article>
  </dialog>

  <!-- CARRITO: panel lateral (un <dialog> pegado a la derecha).
       galeria.js llena #carrito-items y pone el total -->
  <dialog id="carrito" aria-label="Carrito de compras">
    <div class="drawer-caja">
      <header class="drawer-top">
        <h2>Tu carrito <span id="carrito-titulo-n"></span></h2>
        <button type="button" class="drawer-cerrar" aria-label="Cerrar carrito">×</button>
      </header>

      <div id="carrito-items" class="carrito-items"></div>

      <footer class="drawer-pie">
        <div class="carrito-total-fila">
          <span>Total</span>
          <span id="carrito-total">$0</span>
        </div>
        <div class="drawer-botones">
          <button type="button" id="btn-vaciar" class="btn-secundario">Vaciar</button>
          <button type="button" id="btn-pagar" class="btn-agregar">Pagar</button>
        </div>
      </footer>
    </div>
  </dialog>

  <!-- aviso flotante -->
  <div id="aviso" role="status" hidden></div>

  <!-- Scripts: el orden importa. El cliente de Supabase (db) se crea en
       supabaseClient.js y galeria.js lo usa para leer productos_práctica -->
  <script src="js/supabaseClient.js"></script>
  <script src="js/galeria.js"></script>
</body>
</html>

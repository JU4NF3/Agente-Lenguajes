<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis pedidos</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    const temaGuardado = localStorage.getItem('tema');
    const prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (temaGuardado === 'oscuro' || (temaGuardado === null && prefiereOscuro)) {
      document.documentElement.dataset.tema = 'oscuro';
    }
  </script>

  <style>
    /* ===== TOKENS (iguales a galeria/pago/estado-pedido) ===== */
    :root {
      --sans: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;

      --fondo: #ffffff;
      --texto: #0a0a0a;
      --suave: #636363;
      --linea: #0a0a0a;
      --linea-suave: #e3e3e3;

      --boton-fondo: #0a0a0a;
      --boton-texto: #ffffff;
      --boton-borde: #0a0a0a;
      --boton-hover-fondo: #ffffff;
      --boton-hover-texto: #0a0a0a;

      --verde: #16a34a;
      --azul: #2563eb;
      --rojo: #dc2626;
    }

    :root[data-tema="oscuro"] {
      color-scheme: dark;
      --fondo: #0b0b0b;
      --texto: #f2f2f2;
      --suave: #a6a6a6;
      --linea: #f2f2f2;
      --linea-suave: #2b2b2b;

      --boton-fondo: #ffffff;
      --boton-texto: #0a0a0a;
      --boton-borde: #ffffff;
      --boton-hover-fondo: #d4d4d4;
      --boton-hover-texto: #0a0a0a;

      --verde: #4ade80;
      --azul: #60a5fa;
      --rojo: #f87171;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0 clamp(16px, 4vw, 56px) 80px;
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: -0.01em;
      background: var(--fondo);
      color: var(--texto);
      transition: background 0.25s, color 0.25s;
    }

    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--texto); outline-offset: 2px; }

    .rotulo {
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--suave);
    }

    /* ===== BARRA (igual que estado-pedido) ===== */
    .barra-superior {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 18px 0;
      background: var(--fondo);
      border-bottom: 1px solid var(--linea);
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.05em;
      text-decoration: none;
      line-height: 1;
    }
    .nav { display: flex; gap: 20px; margin-left: 8px; }
    .nav a {
      font-family: var(--mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-decoration: none;
      color: var(--suave);
      transition: color 0.2s;
    }
    .nav a:hover { color: var(--texto); }
    .barra-acciones { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    #btn-tema {
      padding: 10px 18px;
      border: 1px solid var(--boton-borde);
      border-radius: 999px;
      background: var(--boton-fondo);
      color: var(--boton-texto);
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    #btn-tema:hover { background: var(--boton-hover-fondo); color: var(--boton-hover-texto); }

    @media (max-width: 560px) {
      .nav { display: none; }
    }

    /* ===== CONTENIDO ===== */
    .envoltura { max-width: 820px; margin: 0 auto; padding-top: clamp(32px, 6vw, 64px); }

    h1 {
      margin: 4px 0 8px;
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }
    .sub { margin: 0 0 32px; color: var(--suave); }

    /* ===== LISTA DE PEDIDOS ===== */
    .lista { display: flex; flex-direction: column; gap: 12px; }

    .pedido {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 6px 16px;
      padding: 18px 20px;
      border: 1px solid var(--linea-suave);
      border-radius: 18px;
      text-decoration: none;
      transition: border-color 0.2s, transform 0.15s;
    }
    .pedido:hover { border-color: var(--texto); transform: translateY(-2px); }

    .pedido-num { font-size: 1.05rem; font-weight: 500; letter-spacing: -0.02em; }
    .pedido-meta {
      grid-column: 1;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--suave);
    }
    .pedido-total {
      grid-row: 1 / span 2;
      grid-column: 2;
      text-align: right;
      font-family: var(--mono);
      font-size: 1.1rem;
      font-weight: 500;
    }
    .pedido-total small {
      display: block;
      margin-top: 2px;
      font-size: 0.68rem;
      font-weight: 400;
      color: var(--suave);
    }

    /* pastilla de estado: el color ayuda, pero el texto siempre dice cuál es */
    .estado {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 10px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 0.66rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      vertical-align: 2px;
    }
    .estado-confirmado { color: var(--suave); }
    .estado-enviado    { color: var(--azul); }
    .estado-entregado  { color: var(--verde); }
    .estado-cancelado  { color: var(--rojo); }

    .vacio {
      padding: 48px 20px;
      border: 1px dashed var(--linea-suave);
      border-radius: 18px;
      text-align: center;
      color: var(--suave);
    }

    .acciones { margin-top: 32px; }
    .acciones a {
      display: inline-block;
      padding: 13px 24px;
      border: 1px solid var(--linea);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }
    .acciones a:hover { background: var(--texto); color: var(--fondo); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header class="barra-superior">
    <a href="galeria.html" class="logo">Pedidos</a>
    <nav class="nav">
      <a href="galeria.html">Tienda</a>
      <a href="cliente.html">Mi cuenta</a>
    </nav>
    <div class="barra-acciones">
      <button type="button" id="btn-tema">Modo oscuro</button>
    </div>
  </header>

  <main class="envoltura">
    <p class="rotulo">Mi cuenta</p>
    <h1>Mis pedidos</h1>
    <p class="sub">Toca un pedido para ver su estado y su detalle.</p>

    <!-- mis-pedidos.js pinta aquí una tarjeta por pedido -->
    <div class="lista" id="lista-pedidos">
      <p class="vacio">Cargando tus pedidos…</p>
    </div>

    <div class="acciones"><a href="galeria.html">← Seguir comprando</a></div>
  </main>

  <script src="js/supabaseClient.js"></script>
  <script src="js/mis-pedidos.js"></script>
</body>
</html>
